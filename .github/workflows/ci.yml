name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm install, not npm ci: the schuettc fork's patches add dependencies
        # (fs-ext-extra-prebuilt, tsx) that upstream's package-lock.json does not
        # carry, and carrying a lockfile would conflict on every upstream rebase.
        # The same install the fork's publish gate (upstream-sync test_cmd) uses.
        run: npm install --no-audit --no-fund

      - name: Run checks
        run: npm run check
