name: Publish pi-usage

on:
  push:
    tags:
      - 'pi-usage-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish trusted pi-usage package
    runs-on: ubuntu-latest
    environment: npm-production

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./extensions/pi-usage/package.json').version")"
          expected_tag="pi-usage-v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version (expected $expected_tag)." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test pi-usage package
        run: npm test --workspace @schuettc/pi-usage

      - name: Run full workspace check
        run: npm run check

      - name: Publish pi-usage with provenance
        run: npm publish --workspace @schuettc/pi-usage --access public --provenance
